<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compass7 - 工具中心</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon-user.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-user-32.png">
  <link rel="apple-touch-icon" href="/static/img/favicon-user.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .hero {
      text-align: center;
      padding: 60px 20px 40px;
      animation: fadeInUp 0.6s ease-out;
    }
    .hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, #34c759 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      color: var(--text-secondary);
      font-size: 1.1rem;
      max-width: 500px;
      margin: 0 auto;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .tool-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 32px 24px;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      transition: all var(--transition);
      animation: fadeInUp 0.6s ease-out backwards;
      cursor: pointer;
      display: block;
    }
    .tool-card:nth-child(1) { animation-delay: 0.1s; }
    .tool-card:nth-child(2) { animation-delay: 0.2s; }
    .tool-card:nth-child(3) { animation-delay: 0.3s; }
    .tool-card:nth-child(4) { animation-delay: 0.4s; }

    .tool-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    .tool-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      display: block;
    }

    .tool-card h2 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .tool-card p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .tool-badge {
      display: inline-block;
      padding: 4px 10px;
      background: var(--primary);
      color: white;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      margin-top: 12px;
    }

    .tool-badge.coming-soon {
      background: var(--text-secondary);
    }

    .tool-card.disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .tool-card.disabled:hover {
      transform: none;
      box-shadow: none;
      border-color: var(--glass-border);
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    footer a {
      color: var(--primary);
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="/home" class="logo">Compass7</a>
      <div class="header-actions">
        <button class="btn-icon" id="theme-toggle" onclick="toggleTheme()">🌙</button>
        <button class="btn btn-sm btn-secondary" onclick="toggleLang()" id="lang-toggle">EN/中</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="hero">
      <h1 data-i18n="welcome_title">Compass7 工具中心</h1>
      <p data-i18n="welcome_desc">选择你需要的工具开始使用</p>
    </div>

    <div class="tools-grid">
      <a href="/timetable" class="tool-card">
        <span class="tool-icon">📅</span>
        <h2 data-i18n="tool_timetable">课表生成器</h2>
        <p data-i18n="tool_timetable_desc">选择学年和班级，生成个人课表，支持导出为图片、Excel 或日历文件</p>
        <span class="tool-badge" data-i18n="available">可用</span>
      </a>

      <a href="/posts" class="tool-card">
        <span class="tool-icon">📢</span>
        <h2 data-i18n="tool_posts">动态</h2>
        <p data-i18n="tool_posts_desc">查看最新分享的照片、公告和内容</p>
        <span class="tool-badge" data-i18n="available">可用</span>
      </a>

      <div class="tool-card disabled">
        <span class="tool-icon">📝</span>
        <h2 data-i18n="tool_homework">作业追踪</h2>
        <p data-i18n="tool_homework_desc">记录和管理每日作业，设置截止日期提醒</p>
        <span class="tool-badge coming-soon" data-i18n="coming_soon">即将推出</span>
      </div>

      <div class="tool-card disabled">
        <span class="tool-icon">📊</span>
        <h2 data-i18n="tool_grades">成绩分析</h2>
        <p data-i18n="tool_grades_desc">查看成绩趋势，分析学习进度</p>
        <span class="tool-badge coming-soon" data-i18n="coming_soon">即将推出</span>
      </div>
      </div>
    </div>
  </main>

  <footer>
    <p><a href="/admin">管理员入口</a></p>
  </footer>

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/theme.js"></script>
  <script>
    // Add i18n strings for home page
    if (typeof i18n !== 'undefined') {
      Object.assign(i18n.zh, {
        welcome_title: 'Compass7 工具中心',
        welcome_desc: '选择你需要的工具开始使用',
        tool_timetable: '课表生成器',
        tool_timetable_desc: '选择学年和班级，生成个人课表，支持导出为图片、Excel 或日历文件',
        tool_posts: '动态',
        tool_posts_desc: '查看最新分享的照片、公告和内容',
        tool_homework: '作业追踪',
        tool_homework_desc: '记录和管理每日作业，设置截止日期提醒',
        tool_grades: '成绩分析',
        tool_grades_desc: '查看成绩趋势，分析学习进度',
        available: '可用',
        coming_soon: '即将推出'
      });
      Object.assign(i18n.en, {
        welcome_title: 'Compass7 Tool Center',
        welcome_desc: 'Choose the tool you need to get started',
        tool_timetable: 'Timetable Generator',
        tool_timetable_desc: 'Select year and class to generate your personal timetable. Export as image, Excel, or calendar file',
        tool_posts: 'Posts',
        tool_posts_desc: 'View the latest shared photos, announcements and content',
        tool_homework: 'Homework Tracker',
        tool_homework_desc: 'Record and manage daily homework with deadline reminders',
        tool_grades: 'Grade Analytics',
        tool_grades_desc: 'View grade trends and analyze learning progress',
        available: 'Available',
        coming_soon: 'Coming Soon'
      });
      applyI18n();
    }
  </script>
</body>
</html>
