<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compass7 - 社团介绍</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon-user.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-user-32.png">
  <link rel="apple-touch-icon" href="/static/img/favicon-user.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .clubs-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .page-header h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .clubs-search {
      position: relative;
      max-width: 500px;
      margin: 0 auto 28px;
    }

    .clubs-search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      opacity: 0.6;
      pointer-events: none;
    }

    .clubs-search-input {
      width: 100%;
      padding: 12px 44px;
      font-size: 1rem;
      color: var(--text);
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      transition: all var(--transition);
      box-sizing: border-box;
    }

    .clubs-search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0,122,255,0.15);
    }

    .clubs-search-input::placeholder {
      color: var(--text-secondary);
    }

    .clubs-search-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background: var(--bg-secondary);
      color: var(--text);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clubs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      align-items: start;
    }

    .club-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 24px;
      animation: fadeInUp 0.5s ease-out backwards;
      cursor: pointer;
      transition: all var(--transition);
    }

    .club-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    .club-card:nth-child(1) { animation-delay: 0.1s; }
    .club-card:nth-child(2) { animation-delay: 0.15s; }
    .club-card:nth-child(3) { animation-delay: 0.2s; }
    .club-card:nth-child(4) { animation-delay: 0.25s; }
    .club-card:nth-child(5) { animation-delay: 0.3s; }
    .club-card:nth-child(6) { animation-delay: 0.35s; }

    .club-name {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .club-slogan {
      color: var(--primary);
      font-size: 0.9rem;
      font-style: italic;
      margin-bottom: 12px;
    }

    .club-description {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .club-poster-preview {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
    }

    .club-leaders-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .club-leader-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--bg-secondary);
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .club-leader-tag::before {
      content: "👤";
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state .icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      text-decoration: none;
      margin-bottom: 16px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* Club Detail Modal */
    .club-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .club-modal-overlay.active {
      display: flex;
    }

    .club-modal {
      background: var(--bg);
      border-radius: var(--radius);
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      animation: fadeInUp 0.3s ease-out;
    }

    .club-modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--bg-secondary);
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .club-modal-content {
      padding: 32px;
    }

    .club-modal-name {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      padding-right: 40px;
    }

    .club-modal-slogan {
      color: var(--primary);
      font-size: 1.1rem;
      font-style: italic;
      margin-bottom: 16px;
    }

    .club-modal-poster {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      background: var(--bg-secondary);
    }

    .club-modal-description {
      line-height: 1.8;
      white-space: pre-wrap;
      margin-bottom: 24px;
    }

    .club-section {
      margin-bottom: 24px;
    }

    .club-section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--primary);
    }

    .club-leaders-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .club-leader-card {
      display: flex;
      gap: 16px;
      background: var(--bg-secondary);
      padding: 16px;
      border-radius: var(--radius-sm);
      align-items: center;
    }

    .club-leader-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .club-leader-details {
      flex: 1;
    }

    .club-leader-name {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .club-leader-contact {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .club-qrcode {
      text-align: center;
    }

    .club-qrcode img {
      max-width: 200px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .club-qrcode-hint {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* Zoomable images */
    .zoomable {
      cursor: zoom-in;
      transition: opacity var(--transition);
    }

    .zoomable:hover {
      opacity: 0.9;
    }

    /* Image Lightbox */
    .lightbox-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
      cursor: zoom-out;
    }

    .lightbox-overlay.active {
      display: flex;
      animation: fadeIn 0.2s ease-out;
    }

    .lightbox-img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
      border-radius: var(--radius-sm);
      animation: fadeInUp 0.3s ease-out;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 1.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2001;
    }

    .lightbox-close:hover {
      background: rgba(255,255,255,0.3);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 600px) {
      .clubs-grid {
        grid-template-columns: 1fr;
      }

      .club-leader-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="/home" class="logo">Compass7</a>
      <div class="header-actions">
        <button class="btn-icon" id="theme-toggle" onclick="toggleTheme()">&#127769;</button>
        <button class="btn btn-sm btn-secondary" onclick="toggleLang()" id="lang-toggle">EN/中</button>
      </div>
    </div>
  </header>

  <main class="clubs-container">
    <a href="/home" class="back-link">&larr; <span data-i18n="back_home">返回主页</span></a>

    <div class="page-header">
      <h1 data-i18n="clubs_title">社团介绍</h1>
      <p class="text-secondary" data-i18n="clubs_desc">了解学校各个社团，找到你感兴趣的活动</p>
    </div>

    <div class="clubs-search">
      <span class="clubs-search-icon">&#128269;</span>
      <input type="text" id="club-search" class="clubs-search-input"
             oninput="filterClubs(this.value)"
             data-i18n-placeholder="search_clubs" placeholder="搜索社团名称、简介或社长...">
      <button class="clubs-search-clear" id="search-clear" onclick="clearSearch()" style="display:none">&times;</button>
    </div>

    <div id="clubs-list" class="clubs-grid">
      <div class="empty-state">
        <div class="icon">&#127914;</div>
        <p>加载中...</p>
      </div>
    </div>

    <div id="no-results" class="empty-state" style="display:none">
      <div class="icon">&#128269;</div>
      <p data-i18n="no_search_results">没有找到匹配的社团</p>
    </div>
  </main>

  <!-- Club Detail Modal -->
  <div class="club-modal-overlay" id="club-modal" onclick="closeClubModal(event)">
    <div class="club-modal" onclick="event.stopPropagation()">
      <button class="club-modal-close" onclick="closeClubModal()">&times;</button>
      <div class="club-modal-content" id="club-modal-content">
        <!-- Filled by JS -->
      </div>
    </div>
  </div>

  <!-- Image Lightbox -->
  <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="" onclick="event.stopPropagation()">
  </div>

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/track.js"></script>
  <script>
    // Add i18n strings
    if (typeof i18n !== 'undefined') {
      Object.assign(i18n.zh, {
        clubs_title: '社团介绍',
        clubs_desc: '了解学校各个社团，找到你感兴趣的活动',
        no_clubs: '暂无社团信息',
        back_home: '返回主页',
        leader: '社长',
        scan_to_join: '扫码加入微信群',
        leader_intro: '社长介绍',
        search_clubs: '搜索社团名称、简介或社长...',
        no_search_results: '没有找到匹配的社团'
      });
      Object.assign(i18n.en, {
        clubs_title: 'School Clubs',
        clubs_desc: 'Learn about school clubs and find activities you are interested in',
        no_clubs: 'No clubs yet',
        back_home: 'Back to Home',
        leader: 'Leader',
        scan_to_join: 'Scan to join WeChat group',
        leader_intro: 'Leader Introduction',
        search_clubs: 'Search by name, description or leader...',
        no_search_results: 'No matching clubs found'
      });
      applyI18n();
    }

    let clubsData = [];

    async function loadClubs() {
      try {
        const res = await fetch("/api/clubs");
        const data = await res.json();
        clubsData = data.clubs || [];
        renderClubs(clubsData);
      } catch (e) {
        console.error("Failed to load clubs:", e);
        document.getElementById("clubs-list").innerHTML = `
          <div class="empty-state">
            <div class="icon">&#9888;&#65039;</div>
            <p>加载失败，请稍后重试</p>
          </div>
        `;
      }
    }

    function renderClubs(clubs) {
      const container = document.getElementById("clubs-list");
      const noResults = document.getElementById("no-results");

      // No clubs at all (not a search miss)
      if (!clubsData.length) {
        noResults.style.display = "none";
        container.style.display = "";
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">&#127914;</div>
            <p data-i18n="no_clubs">${t ? t("no_clubs") : "暂无社团信息"}</p>
          </div>
        `;
        return;
      }

      // Search produced no matches
      if (!clubs.length) {
        container.style.display = "none";
        noResults.style.display = "";
        return;
      }

      container.style.display = "";
      noResults.style.display = "none";

      container.innerHTML = clubs.map((club, idx) => {
        // Poster preview
        let posterHtml = '';
        if (club.poster) {
          posterHtml = `<img src="${club.poster}" class="club-poster-preview" alt="">`;
        }

        // Slogan
        let sloganHtml = '';
        if (club.slogan) {
          sloganHtml = `<div class="club-slogan">${escapeHtml(club.slogan)}</div>`;
        }

        // Leaders tags
        let leadersHtml = '';
        if (club.leaders && club.leaders.length > 0) {
          const tags = club.leaders.map(l => `<span class="club-leader-tag">${escapeHtml(l.name)}</span>`).join('');
          leadersHtml = `<div class="club-leaders-preview">${tags}</div>`;
        }

        return `
          <div class="club-card" onclick="showClubDetail('${club.id}')">
            ${posterHtml}
            <div class="club-name">${escapeHtml(club.name)}</div>
            ${sloganHtml}
            <div class="club-description">${escapeHtml(club.description || '')}</div>
            ${leadersHtml}
          </div>
        `;
      }).join("");
    }

    function filterClubs(query) {
      const q = (query || "").trim().toLowerCase();
      const clearBtn = document.getElementById("search-clear");
      clearBtn.style.display = q ? "flex" : "none";

      if (!q) {
        renderClubs(clubsData);
        return;
      }

      const filtered = clubsData.filter(club => {
        const haystack = [
          club.name,
          club.slogan,
          club.description,
          ...(club.leaders || []).map(l => l.name),
          ...(club.leaders || []).map(l => l.contact)
        ].filter(Boolean).join(" ").toLowerCase();
        return haystack.includes(q);
      });

      renderClubs(filtered);
    }

    function clearSearch() {
      const input = document.getElementById("club-search");
      input.value = "";
      input.focus();
      filterClubs("");
    }

    function showClubDetail(clubId) {
      const club = clubsData.find(c => c.id === clubId);
      if (!club) return;

      // Slogan
      let sloganHtml = '';
      if (club.slogan) {
        sloganHtml = `<div class="club-modal-slogan">${escapeHtml(club.slogan)}</div>`;
      }

      // Poster
      let posterHtml = '';
      if (club.poster) {
        posterHtml = `<img src="${club.poster}" class="club-modal-poster zoomable" alt="" onclick="openLightbox(this.src)">`;
      }

      // Leaders section
      let leadersHtml = '';
      if (club.leaders && club.leaders.length > 0) {
        const leaderCards = club.leaders.map(leader => `
          <div class="club-leader-card">
            <div class="club-leader-icon">&#128100;</div>
            <div class="club-leader-details">
              <div class="club-leader-name">${escapeHtml(leader.name)}</div>
              <div class="club-leader-contact">${escapeHtml(leader.contact || '')}</div>
            </div>
          </div>
        `).join('');
        leadersHtml = `
          <div class="club-section">
            <div class="club-section-title" data-i18n="leader_intro">${t ? t("leader_intro") : "社长介绍"}</div>
            <div class="club-leaders-list">
              ${leaderCards}
            </div>
          </div>
        `;
      }

      // QR Code section
      let qrcodeHtml = '';
      if (club.qrcode) {
        qrcodeHtml = `
          <div class="club-section">
            <div class="club-section-title" data-i18n="scan_to_join">${t ? t("scan_to_join") : "扫码加入微信群"}</div>
            <div class="club-qrcode">
              <img src="${club.qrcode}" alt="QR Code" class="zoomable" onclick="openLightbox(this.src)">
              <div class="club-qrcode-hint" data-i18n="scan_to_join">${t ? t("scan_to_join") : "扫码加入微信群"}</div>
            </div>
          </div>
        `;
      }

      document.getElementById("club-modal-content").innerHTML = `
        <div class="club-modal-name">${escapeHtml(club.name)}</div>
        ${sloganHtml}
        ${posterHtml}
        <div class="club-modal-description">${escapeHtml(club.description || '')}</div>
        ${leadersHtml}
        ${qrcodeHtml}
      `;

      document.getElementById("club-modal").classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeClubModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById("club-modal").classList.remove("active");
      document.body.style.overflow = "";
    }

    function openLightbox(src) {
      const img = document.getElementById("lightbox-img");
      img.src = src;
      document.getElementById("lightbox").classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
      // Only restore scroll if club modal isn't open
      if (!document.getElementById("club-modal").classList.contains("active")) {
        document.body.style.overflow = "";
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // Close modal / lightbox with Escape key
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (document.getElementById("lightbox").classList.contains("active")) {
          closeLightbox();
        } else {
          closeClubModal();
        }
      }
    });

    // Load clubs on page load
    loadClubs();
  </script>
</body>
</html>
