<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compass7 - Admin</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon-admin.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-admin-32.png">
  <link rel="apple-touch-icon" href="/static/img/favicon-admin.png">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="/" class="logo">Compass7</a>
      <div class="header-actions">
        <span id="admin-status" class="text-secondary hidden" data-i18n="admin"></span>
        <button class="btn-icon" id="theme-toggle" onclick="toggleTheme()">🌙</button>
        <button class="btn btn-sm btn-secondary" onclick="toggleLang()" id="lang-toggle">EN/中</button>
        <button class="btn btn-sm btn-secondary hidden" id="logout-btn" onclick="adminLogout()" data-i18n="logout">退出</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Admin Login -->
    <div id="admin-login" class="auth-container">
      <div class="card">
        <h2 data-i18n="admin">管理后台</h2>
        <p id="login-hint" class="text-secondary mb-16" data-i18n="admin_password">管理员密码</p>
        <div class="form-group">
          <input type="password" id="admin-pwd" data-i18n-placeholder="password" placeholder="密码" onkeydown="if(event.key==='Enter')adminLogin()">
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="adminLogin()" data-i18n="login_btn">登录</button>
      </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="hidden">
      <div class="admin-layout">
        <!-- Sidebar -->
        <div class="sidebar">
          <div class="flex-between mb-8">
            <h3 data-i18n="academic_years">学年</h3>
            <button class="btn btn-sm btn-primary" onclick="showAddYear()">+</button>
          </div>
          <div id="years-list"></div>

          <div class="mt-24">
            <div class="flex-between mb-8">
              <h3 data-i18n="classes">班级</h3>
              <button class="btn btn-sm btn-primary" onclick="showAddClass()" id="add-class-btn" class="hidden">+</button>
            </div>
            <div id="classes-list"></div>
          </div>

          <div class="mt-24">
            <button class="btn btn-secondary" style="width:100%" onclick="showManageCourses()" data-i18n="manage_courses">管理课程</button>
          </div>

          <div class="mt-24">
            <button class="btn btn-secondary" style="width:100%" onclick="showManageGroups()" data-i18n="manage_groups">管理课程组</button>
          </div>

          <div class="mt-24">
            <button class="btn btn-secondary" style="width:100%" onclick="exportAllJSON()" id="export-json-btn" data-i18n="export_json">导出为 JSON</button>
          </div>

          <div class="mt-24" style="border-top:1px solid var(--border);padding-top:16px">
            <h3 data-i18n="content_mgmt">内容管理</h3>
            <button class="btn btn-secondary mt-8" style="width:100%" onclick="showClubsManager()" data-i18n="manage_clubs">管理社团</button>
          </div>
        </div>

        <!-- Main Content -->
        <div id="editor-area">
          <div class="card text-center text-secondary" id="editor-placeholder">
            <p data-i18n="select_year">请选择学年和班级</p>
          </div>

          <!-- Schedule Editor -->
          <div id="schedule-editor" class="hidden">
            <div class="flex-between mb-16">
              <h2 id="editor-title"></h2>
              <div>
                <button class="btn btn-primary" onclick="saveSchedule()" data-i18n="save">保存</button>
              </div>
            </div>
            <div class="schedule-wrapper">
              <table class="schedule-grid" id="admin-schedule-table">
                <thead id="admin-schedule-head"></thead>
                <tbody id="admin-schedule-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal: Add Course -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()" data-i18n="cancel">取消</button>
        <button class="btn btn-primary" id="modal-save" data-i18n="save">保存</button>
      </div>
    </div>
  </div>

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    /* ── State ───────────────────────────────────── */
    let selectedYear = null;
    let selectedClass = null;
    let scheduleData = {};

    /* ── Course Library ─────────────────────────── */
    let _courseLibraryCache = [];

    function loadCourseLibrary() {
      return _courseLibraryCache;
    }

    async function fetchCourseLibrary() {
      if (!selectedYear) return;
      try {
        const data = await apiCall(`/api/admin/years/${selectedYear.id}/course-library`);
        _courseLibraryCache = data.library || [];
      } catch { _courseLibraryCache = []; }
    }

    async function saveCourseLibraryToServer() {
      if (!selectedYear) return;
      await apiCall(`/api/admin/years/${selectedYear.id}/course-library`, {
        method: "PUT", body: JSON.stringify({ library: _courseLibraryCache })
      });
    }

    function saveCourseToLibrary(c) {
      const lib = _courseLibraryCache;
      const key = c.name_cn + "|" + c.name_en;
      const idx = lib.findIndex(x => x.name_cn + "|" + x.name_en === key);
      const entry = { name_cn: c.name_cn, name_en: c.name_en, teacher: c.teacher || "", room: c.room || "" };
      if (idx >= 0) lib[idx] = entry; else lib.push(entry);
      lib.sort((a, b) => a.name_cn.localeCompare(b.name_cn, "zh"));
      _courseLibraryCache = lib;
      saveCourseLibraryToServer();
    }

    function showManageCourses() {
      const lib = loadCourseLibrary();
      let html = "";
      if (!lib.length) {
        html = `<p style="color:var(--text-secondary)">${t("no_groups")}</p>`;
      } else {
        html = `<input type="text" id="manage-courses-search" placeholder="🔍" style="margin-bottom:8px" oninput="filterManageCourses()">`;
        html += `<div style="max-height:350px;overflow-y:auto" id="manage-courses-list">` + lib.map((c, i) => {
          const meta = [c.teacher, c.room].filter(Boolean).join(" · ");
          return `<div data-search="${(c.name_cn + c.name_en + (c.teacher||'') + (c.room||'')).toLowerCase()}" style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
            <div><strong>${c.name_cn} / ${c.name_en}</strong>${meta ? `<br><span style="font-size:0.8rem;color:var(--text-secondary)">${meta}</span>` : ""}</div>
            <div style="display:flex;gap:4px">
              <button class="btn btn-sm btn-primary" onclick="showEditLibraryCourse(${i})">✎</button>
              <button class="btn btn-sm btn-danger" onclick="deleteLibraryCourse(${i})">&times;</button>
            </div>
          </div>`;
        }).join("") + `</div>`;
      }
      html += `<button class="btn btn-primary mt-16" onclick="showAddCourseToLibrary()" style="width:100%">+ ${t("add_course")}</button>`;
      showModal(t("manage_courses"), html, null);
      document.getElementById("modal-save").style.display = "none";
    }

    window.filterManageCourses = function() {
      const q = (document.getElementById("manage-courses-search").value || "").toLowerCase();
      document.querySelectorAll("#manage-courses-list > div").forEach(el => {
        el.style.display = !q || (el.dataset.search && el.dataset.search.includes(q)) ? "flex" : "none";
      });
    };

    function deleteLibraryCourse(idx) {
      const lib = loadCourseLibrary();
      lib.splice(idx, 1);
      _courseLibraryCache = lib;
      saveCourseLibraryToServer();
      showManageCourses();
    }

    function showAddCourseToLibrary() {
      showModal(t("add_course"), `
        <div class="form-group"><label>${t("course_name_cn")}</label><input type="text" id="course-cn"></div>
        <div class="form-group"><label>${t("course_name_en")}</label><input type="text" id="course-en"></div>
        <div class="form-group"><label>${t("teacher")}</label><input type="text" id="course-teacher"></div>
        <div class="form-group"><label>${t("classroom")}</label><input type="text" id="course-room"></div>
      `, () => {
        const cn = document.getElementById("course-cn").value.trim();
        const en = document.getElementById("course-en").value.trim();
        if (!cn || !en) return showToast(t("error_required"), "error");
        saveCourseToLibrary({
          name_cn: cn, name_en: en,
          teacher: document.getElementById("course-teacher").value.trim(),
          room: document.getElementById("course-room").value.trim()
        });
        closeModal();
        showManageCourses();
      });
      document.getElementById("modal-save").style.display = "";
    }

    function showEditLibraryCourse(idx) {
      const lib = loadCourseLibrary();
      const c = lib[idx];
      showModal(t("edit"), `
        <div class="form-group"><label>${t("course_name_cn")}</label><input type="text" id="course-cn" value="${c.name_cn}"></div>
        <div class="form-group"><label>${t("course_name_en")}</label><input type="text" id="course-en" value="${c.name_en}"></div>
        <div class="form-group"><label>${t("teacher")}</label><input type="text" id="course-teacher" value="${c.teacher || ""}"></div>
        <div class="form-group"><label>${t("classroom")}</label><input type="text" id="course-room" value="${c.room || ""}"></div>
      `, () => {
        const cn = document.getElementById("course-cn").value.trim();
        const en = document.getElementById("course-en").value.trim();
        if (!cn || !en) return showToast(t("error_required"), "error");
        lib[idx] = { name_cn: cn, name_en: en, teacher: document.getElementById("course-teacher").value.trim(), room: document.getElementById("course-room").value.trim() };
        _courseLibraryCache = lib;
        saveCourseLibraryToServer();
        closeModal();
        showManageCourses();
      });
      document.getElementById("modal-save").style.display = "";
    }

    function buildLibrarySelect(selectId) {
      const id = selectId || "course-lib-select";
      const searchId = id + "-search";
      const listId = id + "-list";
      const lib = loadCourseLibrary();
      if (!lib.length) return "";
      const items = lib.map((c, i) => {
        const meta = [c.teacher, c.room].filter(Boolean).join(" · ");
        const label = c.name_cn + " / " + c.name_en + (meta ? " (" + meta + ")" : "");
        return `<div data-search="${(c.name_cn + c.name_en + (c.teacher||'') + (c.room||'')).toLowerCase()}" data-idx="${i}" style="padding:4px 8px;cursor:pointer;border-bottom:1px solid var(--border);font-size:0.85rem" onmouseover="this.style.background='var(--bg-secondary)'" onmouseout="this.style.background=''" onclick="fillFromLibraryIdx('${id}',${i})">${label}</div>`;
      }).join("");
      return `<div class="form-group"><label>${t("select_from_library")}</label><input type="text" id="${searchId}" placeholder="🔍" style="margin-bottom:6px" oninput="filterLibList('${listId}','${searchId}')"><div id="${listId}" style="max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:4px">${items}</div></div>`;
    }

    window.filterLibList = function(listId, searchId) {
      const q = (document.getElementById(searchId).value || "").toLowerCase();
      document.querySelectorAll("#" + listId + " > div").forEach(el => {
        el.style.display = !q || (el.dataset.search && el.dataset.search.includes(q)) ? "" : "none";
      });
    };

    window.fillFromLibraryIdx = function(id, idx) {
      const lib = loadCourseLibrary();
      const c = lib[idx];
      if (!c) return;
      const prefix = id === "manual-lib-select" ? "mg" : "course";
      document.getElementById(prefix + "-cn").value = c.name_cn;
      document.getElementById(prefix + "-en").value = c.name_en;
      document.getElementById(prefix + "-teacher").value = c.teacher || "";
      document.getElementById(prefix + "-room").value = c.room || "";
    };

    /* ── Course Groups ──────────────────────────── */
    let _courseGroupsCache = [];

    function loadCourseGroups() {
      return _courseGroupsCache;
    }

    async function fetchCourseGroups() {
      if (!selectedYear || !selectedClass) return;
      try {
        const data = await apiCall(`/api/admin/classes/${selectedYear.id}/${selectedClass.id}/course-groups`);
        _courseGroupsCache = data.groups || [];
      } catch { _courseGroupsCache = []; }
    }

    async function saveCourseGroups(groups) {
      _courseGroupsCache = groups;
      if (!selectedYear || !selectedClass) return;
      await apiCall(`/api/admin/classes/${selectedYear.id}/${selectedClass.id}/course-groups`, {
        method: "PUT",
        body: JSON.stringify({ groups })
      });
    }

    function showManageGroups() {
      const groups = loadCourseGroups();
      let html = "";
      if (!groups.length) {
        html = `<p style="color:var(--text-secondary)">${t("no_groups")}</p>`;
      } else {
        html = groups.map((g, i) => {
          const courses = g.courses.map(c => c.name_cn).join("、");
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
            <div><strong>${g.name}</strong><br><span style="font-size:0.8rem;color:var(--text-secondary)">${courses}</span></div>
            <div style="display:flex;gap:4px">
              <button class="btn btn-sm btn-primary" onclick="showEditGroup(${i})">✎</button>
              <button class="btn btn-sm btn-danger" onclick="deleteCourseGroup(${i})">&times;</button>
            </div>
          </div>`;
        }).join("");
      }
      html += `<button class="btn btn-primary mt-16" onclick="showCreateGroup()" style="width:100%">+ ${t("create_group")}</button>`;
      showModal(t("manage_groups"), html, null);
      document.getElementById("modal-save").style.display = "none";
    }

    async function deleteCourseGroup(idx) {
      const groups = loadCourseGroups();
      groups.splice(idx, 1);
      await saveCourseGroups(groups);
      showManageGroups();
    }

    window.showEditGroup = function(idx) {
      const groups = loadCourseGroups();
      const group = groups[idx];
      if (!group) return;
      const lib = loadCourseLibrary();
      const checkedIds = new Set(group.courses.map(c => c.name_cn + "|" + c.name_en));
      const checkboxes = lib.map((c, i) => {
        const meta = [c.teacher, c.room].filter(Boolean).join(" · ");
        const label = c.name_cn + " / " + c.name_en + (meta ? " (" + meta + ")" : "");
        const checked = checkedIds.has(c.name_cn + "|" + c.name_en) ? "checked" : "";
        return `<label style="display:block;padding:3px 0;cursor:pointer" data-search="${(c.name_cn + c.name_en + (c.teacher||'') + (c.room||'')).toLowerCase()}"><input type="checkbox" value="${i}" style="margin-right:6px" ${checked}>${label}</label>`;
      }).join("");
      showModal(t("edit") + " - " + group.name, `
        <div class="form-group"><label>${t("group_name")}</label><input type="text" id="group-name-input" value="${group.name}"></div>
        <div class="form-group"><label>${t("select_courses")}</label><input type="text" id="group-course-search" placeholder="🔍" style="margin-bottom:6px" oninput="filterGroupCourses()"><div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);padding:8px;border-radius:4px" id="group-course-list">${checkboxes}</div></div>
      `, () => {
        const name = document.getElementById("group-name-input").value.trim();
        if (!name) return showToast(t("error_required"), "error");
        const checked = Array.from(document.querySelectorAll("#group-course-list input:checked")).map(cb => lib[parseInt(cb.value)]);
        if (!checked.length) return showToast(t("error_required"), "error");
        groups[idx] = { name, courses: checked };
        saveCourseGroups(groups);
        closeModal();
        showToast(t("success_save"));
      });
      document.getElementById("modal-save").style.display = "";
    };

    function showCreateGroup() {
      const lib = loadCourseLibrary();
      if (!lib.length) return showToast(t("no_groups"), "error");
      const checkboxes = lib.map((c, i) => {
        const meta = [c.teacher, c.room].filter(Boolean).join(" · ");
        const label = c.name_cn + " / " + c.name_en + (meta ? " (" + meta + ")" : "");
        return `<label style="display:block;padding:3px 0;cursor:pointer" data-search="${(c.name_cn + c.name_en + c.teacher + c.room).toLowerCase()}"><input type="checkbox" value="${i}" style="margin-right:6px">${label}</label>`;
      }).join("");
      showModal(t("create_group"), `
        <div class="form-group"><label>${t("group_name")}</label><input type="text" id="group-name-input"></div>
        <div class="form-group"><label>${t("select_courses")}</label><input type="text" id="group-course-search" placeholder="🔍" style="margin-bottom:6px" oninput="filterGroupCourses()"><div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);padding:8px;border-radius:4px" id="group-course-list">${checkboxes}</div></div>
      `, () => {
        const name = document.getElementById("group-name-input").value.trim();
        if (!name) return showToast(t("error_required"), "error");
        const checked = Array.from(document.querySelectorAll("#group-course-list input:checked")).map(cb => lib[parseInt(cb.value)]);
        if (!checked.length) return showToast(t("error_required"), "error");
        const groups = loadCourseGroups();
        groups.push({ name, courses: checked });
        saveCourseGroups(groups);
        closeModal();
        showToast(t("success_save"));
      });
      document.getElementById("modal-save").style.display = "";
    }

    window.filterGroupCourses = function() {
      const q = (document.getElementById("group-course-search").value || "").toLowerCase();
      document.querySelectorAll("#group-course-list label").forEach(el => {
        el.style.display = !q || el.dataset.search.includes(q) ? "block" : "none";
      });
    };

    function addCourseGroup(day, period) {
      const groups = loadCourseGroups();
      if (!groups.length) return showManageGroups();
      const searchId = "add-group-search";
      const listId = "add-group-list";
      const items = groups.map((g, i) => {
        const courses = g.courses.map(c => c.name_cn).join("、");
        return `<div data-search="${(g.name + courses).toLowerCase()}" style="padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--border);font-size:0.85rem" onmouseover="this.style.background='var(--bg-secondary)'" onmouseout="this.style.background=''" onclick="addGroupToSlot(${day},${period},${i})"><strong>${g.name}</strong><br><span style="font-size:0.8rem;color:var(--text-secondary)">${courses}</span></div>`;
      }).join("");
      showModal(t("add_course_group"), `
        <input type="text" id="${searchId}" placeholder="🔍" style="margin-bottom:6px" oninput="filterLibList('${listId}','${searchId}')">
        <div id="${listId}" style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:4px">${items}</div>
      `, null);
      document.getElementById("modal-save").style.display = "none";
    }

    window.addGroupToSlot = function(day, period, idx) {
      const groups = loadCourseGroups();
      const group = groups[idx];
      if (!group) return;
      if (!scheduleData[String(day)]) scheduleData[String(day)] = {};
      if (!scheduleData[String(day)][String(period)]) scheduleData[String(day)][String(period)] = { block_label: null, courses: [] };
      group.courses.forEach(c => {
        scheduleData[String(day)][String(period)].courses.push({
          id: Math.random().toString(36).substr(2, 8),
          name_cn: c.name_cn, name_en: c.name_en,
          teacher: c.teacher || "", room: c.room || ""
        });
      });
      closeModal();
      renderScheduleGrid();
    };

    const PERIODS = [
      { num: 1, time: "8:00-8:40" },
      { num: 2, time: "8:45-9:25" },
      { num: 3, time: "9:35-10:15" },
      { num: 4, time: "10:20-11:00" },
      { num: 5, time: "11:05-11:55" },
      { num: 6, time: "12:00-12:40", lunch: true },
      { num: 7, time: "12:45-13:25" },
      { num: 8, time: "13:30-14:10" },
      { num: 9, time: "14:15-14:55" },
      { num: 10, time: "15:00-15:40" },
      { num: 11, time: "15:45-16:25" }
    ];

    /* ── Admin Auth ──────────────────────────────── */
    async function adminLogin() {
      const pwd = document.getElementById("admin-pwd").value;
      if (!pwd) return;
      try {
        const res = await apiCall("/api/admin/login", {
          method: "POST",
          body: JSON.stringify({ password: pwd })
        });
        document.getElementById("admin-login").classList.add("hidden");
        document.getElementById("admin-panel").classList.remove("hidden");
        document.getElementById("admin-status").classList.remove("hidden");
        document.getElementById("logout-btn").classList.remove("hidden");
        loadYears();
      } catch (e) {
        showToast(e.message, "error");
      }
    }

    function adminLogout() {
      apiCall("/api/admin/logout", { method: "POST" });
      location.reload();
    }

    /* ── Years ───────────────────────────────────── */
    async function loadYears() {
      const data = await apiCall("/api/admin/years");
      const list = document.getElementById("years-list");
      list.innerHTML = "";
      data.years.forEach(y => {
        const div = document.createElement("div");
        div.className = `sidebar-item${selectedYear && selectedYear.id === y.id ? " active" : ""}`;
        div.innerHTML = `<span>${y.name}</span><button class="btn btn-sm btn-danger delete-btn" onclick="event.stopPropagation();deleteYear('${y.id}')">&times;</button>`;
        div.onclick = () => selectYear(y);
        list.appendChild(div);
      });
    }

    function selectYear(year) {
      selectedYear = year;
      selectedClass = null;
      document.getElementById("schedule-editor").classList.add("hidden");
      document.getElementById("editor-placeholder").classList.remove("hidden");
      loadYears();
      loadClasses();
      fetchCourseLibrary();
    }

    function showAddYear() {
      showModal(t("add_year"), `<div class="form-group"><input type="text" id="new-year-name" placeholder="${t("year_name")}"></div>`, async () => {
        const name = document.getElementById("new-year-name").value.trim();
        if (!name) return;
        await apiCall("/api/admin/years", { method: "POST", body: JSON.stringify({ name }) });
        closeModal();
        loadYears();
      });
    }

    async function deleteYear(id) {
      if (!confirm(t("confirm_delete"))) return;
      await apiCall(`/api/admin/years/${id}`, { method: "DELETE" });
      if (selectedYear && selectedYear.id === id) {
        selectedYear = null;
        selectedClass = null;
      }
      loadYears();
      loadClasses();
    }

    /* ── Classes ─────────────────────────────────── */
    async function loadClasses() {
      const list = document.getElementById("classes-list");
      if (!selectedYear) { list.innerHTML = ""; return; }
      const data = await apiCall(`/api/admin/years/${selectedYear.id}/classes`);
      list.innerHTML = "";
      data.classes.forEach(c => {
        const div = document.createElement("div");
        div.className = `sidebar-item${selectedClass && selectedClass.id === c.id ? " active" : ""}`;
        div.innerHTML = `<span>${c.name}</span><span style="display:inline-flex;gap:4px;"><button class="btn btn-sm btn-secondary delete-btn" onclick="event.stopPropagation();renameClass('${c.id}','${c.name.replace(/'/g,"\\'")}')" title="${t("edit")}">✏️</button><button class="btn btn-sm btn-danger delete-btn" onclick="event.stopPropagation();deleteClass('${c.id}')">&times;</button></span>`;
        div.onclick = () => selectClass(c);
        list.appendChild(div);
      });
    }

    function selectClass(cls) {
      selectedClass = cls;
      loadClasses();
      loadSchedule();
      fetchCourseGroups();
    }

    function showAddClass() {
      if (!selectedYear) return showToast(t("select_year"), "error");
      showModal(t("add_class"), `<div class="form-group"><input type="text" id="new-class-name" placeholder="${t("class_name")}"></div>`, async () => {
        const name = document.getElementById("new-class-name").value.trim();
        if (!name) return;
        await apiCall(`/api/admin/years/${selectedYear.id}/classes`, { method: "POST", body: JSON.stringify({ name }) });
        closeModal();
        loadClasses();
      });
    }

    async function deleteClass(id) {
      if (!confirm(t("confirm_delete"))) return;
      await apiCall(`/api/admin/years/${selectedYear.id}/classes/${id}`, { method: "DELETE" });
      if (selectedClass && selectedClass.id === id) selectedClass = null;
      loadClasses();
    }

    function renameClass(id, currentName) {
      showModal(t("edit") + " " + t("class_name"), `
        <div class="form-group"><label>${t("class_name")}</label><input type="text" id="rename-class-input" value="${currentName}"></div>
      `, async () => {
        const newName = document.getElementById("rename-class-input").value.trim();
        if (!newName) return showToast(t("error_required"), "error");
        await apiCall(`/api/admin/years/${selectedYear.id}/classes/${id}`, {
          method: "PUT",
          body: JSON.stringify({ name: newName })
        });
        if (selectedClass && selectedClass.id === id) selectedClass.name = newName;
        closeModal();
        loadClasses();
      });
    }

    /* ── Schedule Editor ─────────────────────────── */
    async function loadSchedule() {
      if (!selectedYear || !selectedClass) return;
      const data = await apiCall(`/api/admin/classes/${selectedYear.id}/${selectedClass.id}/schedule`);
      scheduleData = data.schedule || {};
      // Auto-populate course library from loaded schedule
      let libChanged = false;
      const lib = _courseLibraryCache;
      for (const day of Object.values(scheduleData)) {
        for (const period of Object.values(day)) {
          (period.courses || []).forEach(c => {
            const key = c.name_cn + "|" + c.name_en;
            const idx = lib.findIndex(x => x.name_cn + "|" + x.name_en === key);
            const entry = { name_cn: c.name_cn, name_en: c.name_en, teacher: c.teacher || "", room: c.room || "" };
            if (idx >= 0) lib[idx] = entry; else { lib.push(entry); libChanged = true; }
          });
        }
      }
      if (libChanged) {
        lib.sort((a, b) => a.name_cn.localeCompare(b.name_cn, "zh"));
        _courseLibraryCache = lib;
        saveCourseLibraryToServer();
      }
      document.getElementById("editor-placeholder").classList.add("hidden");
      document.getElementById("schedule-editor").classList.remove("hidden");
      document.getElementById("editor-title").textContent = `${selectedYear.name} - ${selectedClass.name}`;
      renderScheduleGrid();
    }

    function renderScheduleGrid() {
      const days = [t("monday"), t("tuesday"), t("wednesday"), t("thursday"), t("friday")];
      const head = document.getElementById("admin-schedule-head");
      const body = document.getElementById("admin-schedule-body");

      head.innerHTML = `<tr><th>${t("period")}</th><th>${t("time")}</th>${days.map((d, i) => `<th>${d}</th>`).join("")}</tr>`;
      body.innerHTML = "";

      PERIODS.forEach(p => {
        const tr = document.createElement("tr");
        if (p.lunch) tr.classList.add("lunch-row");

        // Period label cell
        const labelTd = document.createElement("td");
        labelTd.className = "period-label";
        const blockLabel = getBlockLabel(p.num);
        if (blockLabel) {
          labelTd.innerHTML = `<span class="block-label" onclick="editBlockLabel(${p.num})">${blockLabel}</span>`;
        } else {
          labelTd.innerHTML = p.lunch
            ? t("lunch")
            : `<span class="block-label" onclick="editBlockLabel(${p.num})">${p.label || (t("period") + " " + p.num)}</span>`;
        }
        tr.appendChild(labelTd);

        // Time cell
        const timeTd = document.createElement("td");
        timeTd.className = "period-label";
        timeTd.innerHTML = `<span class="period-time">${p.time}</span>`;
        tr.appendChild(timeTd);

        // Day cells
        for (let d = 1; d <= 5; d++) {
          const td = document.createElement("td");
          td.className = "slot-cell";
          const slot = (scheduleData[String(d)] && scheduleData[String(d)][String(p.num)]) || { courses: [] };

          const MAX_VISIBLE = 3;
          slot.courses.forEach((c, idx) => {
            const tag = document.createElement("span");
            tag.className = "course-tag";
            if (idx >= MAX_VISIBLE) tag.classList.add("hidden-tag");
            const label = currentLang === "zh" ? c.name_cn : c.name_en;
            const meta = [c.teacher, c.room].filter(Boolean).join(" · ");
            tag.textContent = label;
            if (meta) tag.title = meta;
            tag.onclick = () => editCourse(d, p.num, idx);
            td.appendChild(tag);
          });

          if (slot.courses.length > MAX_VISIBLE) {
            const moreBtn = document.createElement("span");
            moreBtn.className = "show-more-btn";
            const extra = slot.courses.length - MAX_VISIBLE;
            moreBtn.textContent = `+${extra}`;
            moreBtn.onclick = (e) => {
              e.stopPropagation();
              td.classList.toggle("expanded");
              moreBtn.textContent = td.classList.contains("expanded") ? t("collapse") || "收起" : `+${extra}`;
            };
            td.appendChild(moreBtn);
          }

          {
            const addBtn = document.createElement("button");
            addBtn.className = "add-course-btn";
            addBtn.textContent = "+ " + t("add_course");
            addBtn.onclick = () => addCourse(d, p.num);
            td.appendChild(addBtn);

            const addGroupBtn = document.createElement("button");
            addGroupBtn.className = "add-course-btn add-group-btn";
            addGroupBtn.textContent = "+ " + t("add_course_group");
            addGroupBtn.onclick = () => addCourseGroup(d, p.num);
            td.appendChild(addGroupBtn);
          }

          tr.appendChild(td);
        }
        body.appendChild(tr);
      });
    }

    function getBlockLabel(period) {
      // Check any day for a block label on this period
      for (let d = 1; d <= 5; d++) {
        const slot = scheduleData[String(d)] && scheduleData[String(d)][String(period)];
        if (slot && slot.block_label) return slot.block_label;
      }
      return null;
    }

    function editBlockLabel(period) {
      const current = getBlockLabel(period) || "";
      showModal(t("block_label"), `<div class="form-group"><input type="text" id="block-label-input" value="${current}" placeholder="${t("block_label")}"></div>`, () => {
        const label = document.getElementById("block-label-input").value.trim() || null;
        for (let d = 1; d <= 5; d++) {
          if (!scheduleData[String(d)]) scheduleData[String(d)] = {};
          if (!scheduleData[String(d)][String(period)]) scheduleData[String(d)][String(period)] = { block_label: null, courses: [] };
          scheduleData[String(d)][String(period)].block_label = label;
        }
        closeModal();
        renderScheduleGrid();
      });
    }

    function addCourse(day, period) {
      const lib = loadCourseLibrary();
      const searchId = "add-course-search";
      const listId = "add-course-list";
      const items = lib.map((c, i) => {
        const meta = [c.teacher, c.room].filter(Boolean).join(" · ");
        const label = c.name_cn + " / " + c.name_en + (meta ? " (" + meta + ")" : "");
        return `<div data-search="${(c.name_cn + c.name_en + (c.teacher||'') + (c.room||'')).toLowerCase()}" style="padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--border);font-size:0.85rem" onmouseover="this.style.background='var(--bg-secondary)'" onmouseout="this.style.background=''" onclick="addCourseFromLib(${day},${period},${i})">${label}</div>`;
      }).join("");
      const listHtml = lib.length ? `<input type="text" id="${searchId}" placeholder="🔍" style="margin-bottom:6px" oninput="filterLibList('${listId}','${searchId}')"><div id="${listId}" style="max-height:250px;overflow-y:auto;border:1px solid var(--border);border-radius:4px">${items}</div>` : "";
      showModal(t("add_course"), `
        ${listHtml}
        <hr style="margin:12px 0;border-color:var(--border)">
        <div class="form-group"><label>${t("course_name_cn")}</label><input type="text" id="course-cn"></div>
        <div class="form-group"><label>${t("course_name_en")}</label><input type="text" id="course-en"></div>
        <div class="form-group"><label>${t("teacher")}</label><input type="text" id="course-teacher"></div>
        <div class="form-group"><label>${t("classroom")}</label><input type="text" id="course-room"></div>
      `, () => {
        const cn = document.getElementById("course-cn").value.trim();
        const en = document.getElementById("course-en").value.trim();
        const teacher = document.getElementById("course-teacher").value.trim();
        const room = document.getElementById("course-room").value.trim();
        if (!cn || !en) return showToast(t("error_required"), "error");
        if (!scheduleData[String(day)]) scheduleData[String(day)] = {};
        if (!scheduleData[String(day)][String(period)]) scheduleData[String(day)][String(period)] = { block_label: null, courses: [] };
        const course = {
          id: Math.random().toString(36).substr(2, 8),
          name_cn: cn, name_en: en, teacher: teacher || "", room: room || ""
        };
        scheduleData[String(day)][String(period)].courses.push(course);
        saveCourseToLibrary(course);
        closeModal();
        renderScheduleGrid();
      });
    }

    window.addCourseFromLib = function(day, period, idx) {
      const lib = loadCourseLibrary();
      const c = lib[idx];
      if (!c) return;
      if (!scheduleData[String(day)]) scheduleData[String(day)] = {};
      if (!scheduleData[String(day)][String(period)]) scheduleData[String(day)][String(period)] = { block_label: null, courses: [] };
      scheduleData[String(day)][String(period)].courses.push({
        id: Math.random().toString(36).substr(2, 8),
        name_cn: c.name_cn, name_en: c.name_en,
        teacher: c.teacher || "", room: c.room || ""
      });
      closeModal();
      renderScheduleGrid();
    };

    function editCourse(day, period, idx) {
      const slot = scheduleData[String(day)][String(period)];
      const course = slot.courses[idx];
      showModal(t("edit"), `
        <div class="form-group"><label>${t("course_name_cn")}</label><input type="text" id="course-cn" value="${course.name_cn}"></div>
        <div class="form-group"><label>${t("course_name_en")}</label><input type="text" id="course-en" value="${course.name_en}"></div>
        <div class="form-group"><label>${t("teacher")}</label><input type="text" id="course-teacher" value="${course.teacher || ""}"></div>
        <div class="form-group"><label>${t("classroom")}</label><input type="text" id="course-room" value="${course.room || ""}"></div>
        <button class="btn btn-danger mt-16" onclick="deleteCourse(${day},${period},${idx})">${t("delete")}</button>
      `, () => {
        course.name_cn = document.getElementById("course-cn").value.trim();
        course.name_en = document.getElementById("course-en").value.trim();
        course.teacher = document.getElementById("course-teacher").value.trim();
        course.room = document.getElementById("course-room").value.trim();
        closeModal();
        renderScheduleGrid();
      });
    }

    function deleteCourse(day, period, idx) {
      scheduleData[String(day)][String(period)].courses.splice(idx, 1);
      closeModal();
      renderScheduleGrid();
    }

    async function saveSchedule() {
      try {
        await apiCall(`/api/admin/classes/${selectedYear.id}/${selectedClass.id}/schedule`, {
          method: "PUT",
          body: JSON.stringify({ schedule: scheduleData })
        });
        showToast(t("success_save"));
      } catch (e) {
        showToast(e.message, "error");
      }
    }

    /* ── Export ──────────────────────────────────── */


    async function exportAllJSON() {
      try {
        const yearsData = await apiCall("/api/admin/years");
        if (!yearsData.years.length) return showToast(t("no_data"), "error");

        const exportData = { version: 1, exported_at: new Date().toISOString(), years: [] };
        for (const year of yearsData.years) {
          const classesData = await apiCall(`/api/admin/years/${year.id}/classes`);
          const yearExport = { id: year.id, name: year.name, classes: [] };
          for (const cls of classesData.classes) {
            const schedData = await apiCall(`/api/admin/classes/${year.id}/${cls.id}/schedule`);
            yearExport.classes.push({ id: cls.id, name: cls.name, schedule: schedData.schedule || {} });
          }
          exportData.years.push(yearExport);
        }

        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.download = `compass7_backup_${new Date().toISOString().split("T")[0]}.json`;
        link.href = URL.createObjectURL(blob);
        link.click();
        showToast(t("success_save"));
      } catch (e) {
        showToast(e.message, "error");
      }
    }

    /* ── Modal ───────────────────────────────────── */
    function showModal(title, bodyHtml, onSave) {
      document.getElementById("modal-title").textContent = title;
      document.getElementById("modal-body").innerHTML = bodyHtml;
      document.getElementById("modal-save").onclick = onSave;
      document.getElementById("modal-overlay").classList.add("active");
    }

    function closeModal() {
      document.getElementById("modal-overlay").classList.remove("active");
      document.getElementById("modal-save").style.display = "";
    }

    /* ── Language change listener ─────────────────── */
    window.addEventListener("langchange", () => {
      if (selectedClass) renderScheduleGrid();
      document.getElementById("editor-title").textContent =
        selectedYear && selectedClass ? `${selectedYear.name} - ${selectedClass.name}` : "";
    });

    /* ── Clubs Management (社团管理) ────────────────────── */
    let clubsData = [];

    async function showClubsManager() {
      try {
        const data = await apiCall("/api/admin/clubs");
        clubsData = data.clubs || [];
      } catch { clubsData = []; }

      let html = "";
      if (!clubsData.length) {
        html = `<p style="color:var(--text-secondary)">暂无社团</p>`;
      } else {
        html = `<div style="max-height:400px;overflow-y:auto">`;
        clubsData.forEach((club, i) => {
          const leaderInfo = club.leader_name ? ` · 社长: ${club.leader_name}` : "";
          html += `<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border)">
            <div style="flex:1">
              <strong>${club.name}</strong>
              <div style="font-size:0.85rem;color:var(--text-secondary)">${leaderInfo}</div>
              <div style="font-size:0.85rem;margin-top:4px">${club.description ? (club.description.length > 50 ? club.description.substring(0, 50) + "..." : club.description) : ""}</div>
            </div>
            <div style="display:flex;gap:4px;margin-left:8px">
              <button class="btn btn-sm btn-primary" onclick="showEditClub('${club.id}')">✎</button>
              <button class="btn btn-sm btn-danger" onclick="deleteClub('${club.id}')">&times;</button>
            </div>
          </div>`;
        });
        html += `</div>`;
      }
      html += `<button class="btn btn-primary mt-16" onclick="showCreateClub()" style="width:100%">+ 添加社团</button>`;

      showModal("管理社团", html, null);
      document.getElementById("modal-save").style.display = "none";
    }

    function showCreateClub() {
      showModal("添加社团", `
        <div class="form-group">
          <label>社团名称 *</label>
          <input type="text" id="club-name" placeholder="社团名称">
        </div>
        <div class="form-group">
          <label>社团简介</label>
          <textarea id="club-description" rows="4" style="width:100%;resize:vertical;padding:8px;border:1px solid var(--border);border-radius:4px;font-family:inherit" placeholder="社团简介..."></textarea>
        </div>
        <hr style="margin:16px 0;border-color:var(--border)">
        <h4 style="margin-bottom:12px">社长信息</h4>
        <div class="form-group">
          <label>社长姓名</label>
          <input type="text" id="club-leader-name" placeholder="社长姓名">
        </div>
        <div class="form-group">
          <label>社长介绍</label>
          <textarea id="club-leader-intro" rows="3" style="width:100%;resize:vertical;padding:8px;border:1px solid var(--border);border-radius:4px;font-family:inherit" placeholder="社长介绍..."></textarea>
        </div>
        <div class="form-group">
          <label>社长照片</label>
          <input type="file" id="club-leader-photo" accept="image/*" onchange="previewClubImage('leader-photo')">
          <div id="club-leader-photo-preview" style="margin-top:8px"></div>
        </div>
        <hr style="margin:16px 0;border-color:var(--border)">
        <div class="form-group">
          <label>微信群二维码</label>
          <input type="file" id="club-qrcode" accept="image/*" onchange="previewClubImage('qrcode')">
          <div id="club-qrcode-preview" style="margin-top:8px"></div>
        </div>
      `, async () => {
        const name = document.getElementById("club-name").value.trim();
        const description = document.getElementById("club-description").value.trim();
        const leaderName = document.getElementById("club-leader-name").value.trim();
        const leaderIntro = document.getElementById("club-leader-intro").value.trim();

        if (!name) return showToast("请输入社团名称", "error");

        // Upload images
        const qrcodeUrl = await uploadClubImage("qrcode");
        const leaderPhotoUrl = await uploadClubImage("leader-photo");

        try {
          await apiCall("/api/admin/clubs", {
            method: "POST",
            body: JSON.stringify({
              name, description,
              qrcode: qrcodeUrl,
              leader_name: leaderName,
              leader_intro: leaderIntro,
              leader_photo: leaderPhotoUrl
            })
          });
          showToast("添加成功");
          closeModal();
          showClubsManager();
        } catch (e) {
          showToast(e.message, "error");
        }
      });
      document.getElementById("modal-save").style.display = "";
    }

    window.showEditClub = async function(clubId) {
      const club = clubsData.find(c => c.id === clubId);
      if (!club) return;

      const existingQrcode = club.qrcode ? `<div style="margin-bottom:8px"><img src="${club.qrcode}" style="max-width:150px;border-radius:4px"><button onclick="removeClubImage('qrcode','${club.qrcode}')" style="margin-left:8px" class="btn btn-sm btn-danger">删除</button></div>` : "";
      const existingLeaderPhoto = club.leader_photo ? `<div style="margin-bottom:8px"><img src="${club.leader_photo}" style="max-width:100px;border-radius:50%"><button onclick="removeClubImage('leader-photo','${club.leader_photo}')" style="margin-left:8px" class="btn btn-sm btn-danger">删除</button></div>` : "";

      showModal("编辑社团", `
        <div class="form-group">
          <label>社团名称 *</label>
          <input type="text" id="club-name" value="${club.name}" placeholder="社团名称">
        </div>
        <div class="form-group">
          <label>社团简介</label>
          <textarea id="club-description" rows="4" style="width:100%;resize:vertical;padding:8px;border:1px solid var(--border);border-radius:4px;font-family:inherit" placeholder="社团简介...">${club.description || ""}</textarea>
        </div>
        <hr style="margin:16px 0;border-color:var(--border)">
        <h4 style="margin-bottom:12px">社长信息</h4>
        <div class="form-group">
          <label>社长姓名</label>
          <input type="text" id="club-leader-name" value="${club.leader_name || ""}" placeholder="社长姓名">
        </div>
        <div class="form-group">
          <label>社长介绍</label>
          <textarea id="club-leader-intro" rows="3" style="width:100%;resize:vertical;padding:8px;border:1px solid var(--border);border-radius:4px;font-family:inherit" placeholder="社长介绍...">${club.leader_intro || ""}</textarea>
        </div>
        <div class="form-group">
          <label>社长照片</label>
          <div id="existing-leader-photo">${existingLeaderPhoto}</div>
          <input type="hidden" id="existing-leader-photo-url" value="${club.leader_photo || ""}">
          <input type="file" id="club-leader-photo" accept="image/*" onchange="previewClubImage('leader-photo')">
          <div id="club-leader-photo-preview" style="margin-top:8px"></div>
        </div>
        <hr style="margin:16px 0;border-color:var(--border)">
        <div class="form-group">
          <label>微信群二维码</label>
          <div id="existing-qrcode">${existingQrcode}</div>
          <input type="hidden" id="existing-qrcode-url" value="${club.qrcode || ""}">
          <input type="file" id="club-qrcode" accept="image/*" onchange="previewClubImage('qrcode')">
          <div id="club-qrcode-preview" style="margin-top:8px"></div>
        </div>
      `, async () => {
        const name = document.getElementById("club-name").value.trim();
        const description = document.getElementById("club-description").value.trim();
        const leaderName = document.getElementById("club-leader-name").value.trim();
        const leaderIntro = document.getElementById("club-leader-intro").value.trim();

        if (!name) return showToast("请输入社团名称", "error");

        // Get existing URLs or upload new images
        let qrcodeUrl = document.getElementById("existing-qrcode-url").value;
        let leaderPhotoUrl = document.getElementById("existing-leader-photo-url").value;

        const newQrcode = await uploadClubImage("qrcode");
        const newLeaderPhoto = await uploadClubImage("leader-photo");

        if (newQrcode) qrcodeUrl = newQrcode;
        if (newLeaderPhoto) leaderPhotoUrl = newLeaderPhoto;

        try {
          await apiCall(`/api/admin/clubs/${clubId}`, {
            method: "PUT",
            body: JSON.stringify({
              name, description,
              qrcode: qrcodeUrl,
              leader_name: leaderName,
              leader_intro: leaderIntro,
              leader_photo: leaderPhotoUrl
            })
          });
          showToast("更新成功");
          closeModal();
          showClubsManager();
        } catch (e) {
          showToast(e.message, "error");
        }
      });
      document.getElementById("modal-save").style.display = "";
    };

    window.removeClubImage = function(type, url) {
      if (type === "qrcode") {
        document.getElementById("existing-qrcode").innerHTML = "";
        document.getElementById("existing-qrcode-url").value = "";
      } else if (type === "leader-photo") {
        document.getElementById("existing-leader-photo").innerHTML = "";
        document.getElementById("existing-leader-photo-url").value = "";
      }
    };

    window.deleteClub = async function(clubId) {
      if (!confirm("确定要删除这个社团吗？")) return;
      try {
        await apiCall(`/api/admin/clubs/${clubId}`, { method: "DELETE" });
        showToast("已删除");
        showClubsManager();
      } catch (e) {
        showToast(e.message, "error");
      }
    };

    function previewClubImage(type) {
      const input = document.getElementById(`club-${type}`);
      const preview = document.getElementById(`club-${type}-preview`);
      preview.innerHTML = "";

      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const maxWidth = type === "leader-photo" ? "100px" : "150px";
          const style = type === "leader-photo" ? "border-radius:50%" : "border-radius:4px";
          preview.innerHTML = `<img src="${e.target.result}" style="max-width:${maxWidth};${style}">`;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function uploadClubImage(type) {
      const input = document.getElementById(`club-${type}`);
      if (!input.files || !input.files[0]) return null;

      const formData = new FormData();
      formData.append("file", input.files[0]);

      try {
        const res = await fetch("/api/admin/upload", {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        return data.url || null;
      } catch (e) {
        console.error("Upload failed:", e);
        return null;
      }
    }
  </script>
</body>
</html>
